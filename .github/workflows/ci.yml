name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      DATABASE_URL: postgresql+asyncpg://opspod:opspod@localhost:5432/opspod
      REDIS_URL: redis://localhost:6379/0
      LLM_MODE: fake
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: opspod, POSTGRES_PASSWORD: opspod, POSTGRES_DB: opspod}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U opspod" --health-interval 5s --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: make lint
      - run: make test
      # Release gate. Replays the recorded real-model cassettes (no network, no keys); the stub
      # LLM gates rule-only changes inside `make test`.
      - run: make eval
      - run: make alerts-test
