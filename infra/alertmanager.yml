# Local stand-in for paging: alerts are POSTed to the API, which logs them.
route:
  receiver: opspod-log
  group_by: [alertname]
  group_wait: 5s
  repeat_interval: 1h
receivers:
  - name: opspod-log
    webhook_configs:
      - url: http://host.docker.internal:8000/internal/alerts
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials: dev-alerts
